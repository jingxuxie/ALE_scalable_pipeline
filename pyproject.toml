[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "paper2ale"
version = "0.3.0"
description = "A provenance-first compiler for paper-grounded, paper-blind ALE tasks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pypdf>=5,<7"]

[project.scripts]
paper2ale = "paper2ale.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paper2ale = ["schemas/*.json"]
