[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "paper2ale"
version = "0.2.0"
description = "A provenance-first compiler for paper-grounded, paper-blind ALE tasks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pypdf>=5.0"]

[project.scripts]
paper2ale = "paper2ale.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"paper2ale/schemas" = [
  "schemas/project.schema.json",
  "schemas/evidence_graph.schema.json",
  "schemas/task_blueprint.schema.json",
  "schemas/difficulty_profile.schema.json",
]
