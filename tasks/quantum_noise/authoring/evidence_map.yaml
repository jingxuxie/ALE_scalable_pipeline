    exact_quote_or_value: 'pattern is identical; observed-rate correlation magnitudes are decreased'
    confidence: high
    corroborating_evidence_ids:
      - evidence-paper-observed-rate-definition
    conflicting_evidence_ids: []
    used_by_claim_ids:
      - claim-leaf-observed-rates-preserve-correlations
    used_by_operation_ids:
      - op-compute-dependence-diagnostics
    participant_requirement_allowed: true
    notes: This supports diagnostic transfer, not equality of numeric magnitudes.

