  - evidence_id: evidence-paper-observed-rate-definition
    type: definition
    statement: >-
      Local-Clifford averaging reduces the representation from 4^n Pauli rates
      to 2^n observed error rates while retaining many-body correlation content.
    origin_class: paper_reported
    source:
      source_id: arxiv-1907.13022v2
      locator_type: path-lines
      locator:
        path: authoring/sources/paper_source/noiseLearningArxiv.tex
        start_line: 165
        end_line: 169
        section: main text
    exact_quote_or_value: '4^n to 2^n; observed error rates retain many-body correlations'
    confidence: high
    corroborating_evidence_ids:
      - evidence-paper-observed-vs-pauli-correlation
      - evidence-paper-observed-pauli-visibility-map
    conflicting_evidence_ids: []
    used_by_claim_ids:
      - claim-leaf-observed-rates-preserve-correlations
      - claim-leaf-long-range-correlations-and-local-model-mismatch
    used_by_operation_ids:
      - op-reconstruct-simplex-distribution
      - op-compute-dependence-diagnostics
    participant_requirement_allowed: true
    notes: Public tasks must not mislabel the 2^n vector as the full 4^n Pauli distribution.

  - evidence_id: evidence-paper-observed-pauli-visibility-map
    type: equation
    statement: >-
      For each qubit, local-Clifford Pauli-support probabilities map to observed
      error probabilities through B=[[1,1/3],[0,2/3]], with inverse
      NH=[[1,-1/2],[0,3/2]]; the n-qubit map is the tensor power.
    origin_class: paper_reported
    source:
      source_id: arxiv-1907.13022v2
      locator_type: path-lines
      locator:
        path: authoring/sources/paper_source/noiseLearningArxiv.tex
        line_ranges:
          - {start_line: 1660, end_line: 1692}
          - {start_line: 1994, end_line: 2045}
        section: supplementary observed error rates and Pauli error rates
    exact_quote_or_value: 'B=[[1,1/3],[0,2/3]]; NH=B^-1=[[1,-1/2],[0,3/2]]; tensor-power map'
    confidence: high
    corroborating_evidence_ids:
      - evidence-paper-observed-rate-definition
    conflicting_evidence_ids: []
    used_by_claim_ids:
      - claim-leaf-observed-rates-preserve-correlations
      - claim-leaf-long-range-correlations-and-local-model-mismatch
    used_by_operation_ids:
      - op-reconstruct-simplex-distribution
    participant_requirement_allowed: false
    notes: >-
      Spectral hidden cases must be generated inside this physical image: sample
      a nonnegative normalized Pauli-support vector s, set q=B^tensor-n s, and
      have the privileged oracle verify inverse recovery and nonnegative support.
      Participants reconstruct observed q and need not know hidden s.

