    - Figure 4 metric, fit-family, and indexing conflicts prevent exact plot-value oracle use.
    - Paper fit-cutoff symbols are undefined, experimental run counts disagree, and the simulation length grid is ambiguous; none is used as selected-task oracle truth.
    - The bounded-degree GRF proof is delegated to Ref. 28 and is stated only up to normalization; the junction-tree width/query contract is a grounded benchmark extension.
