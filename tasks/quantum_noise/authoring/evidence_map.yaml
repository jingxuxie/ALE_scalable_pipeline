      The supplement gives threshold formulas for discarding late decay points,
      but switches from p_1 to p_0 and does not define either symbol locally.
    origin_class: paper_reported
    source:
      source_id: arxiv-1907.13022v2
      locator_type: path-lines
      locator:
        path: authoring/sources/paper_source/noiseLearningArxiv.tex
        line_ranges:
          - {start_line: 1197, end_line: 1197}
          - {start_line: 1211, end_line: 1211}
        section: supplementary experimental fit details
    exact_quote_or_value: 'single-qubit `(p_1+1/16)/4`; two-qubit `(p_0+1/16)/4`; no local definition'
    confidence: high
    corroborating_evidence_ids: []
    conflicting_evidence_ids:
      - evidence-paper-decay-model
      - evidence-paper-experiment-protocol
    used_by_claim_ids:
      - claim-leaf-spam-free-spectrum
    used_by_operation_ids:
      - op-fit-nuisance-decays
    participant_requirement_allowed: false
    notes: >-
      The benchmark therefore discloses an all-length conditioned fit instead of
      asking participants to recover an undefined paper-specific cutoff.

