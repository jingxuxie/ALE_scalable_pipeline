  known_gaps:
    - Official Julia and Wolfram workflows were not executed.
    - The empirical data worktree is incomplete; notebooks and worktree data.zip are absent.
    - Dryad version 5/internal version 70586 provides exact official hashes for all four release files despite the incomplete local worktree.
    - The LFS data archive was not extracted or unpickled.
    - Paper bytes remain author-only under arXiv's non-exclusive distribution license.
    - Checkout-stable spectral build 0bba762f4be56c68c2b20c5147c99d37b716f47ae74a8cff88f7f2271e796a1b and participant projection eaeef52ee4dc8f7c97ef26d0bb2070a42feb3d50ec21da9499be2dbe817fa1d2 have zero CRLF/cache files and passed an independent ten-of-ten rerun; peak memory and production-container enforcement remain unmeasured.
