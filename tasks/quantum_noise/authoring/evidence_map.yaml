schema_version: paper2ale.codex-evidence-map/v1

paper_id: arxiv-1907.13022v2

records:
  - evidence_id: evidence-paper-randomized-x-mask
    type: protocol
    statement: >-
      The experiment randomly compiled an X gate into each submitted sequence and
      interpreted the resulting distribution accordingly to remove SPAM bias.
    origin_class: paper_reported
    source:
      source_id: arxiv-1907.13022v2
      locator_type: path-lines
      locator:
        path: authoring/sources/paper_source/noiseLearningArxiv.tex
        start_line: 1213
        end_line: 1213
        section: supplementary experimental details
    exact_quote_or_value: 'randomly compiled X gate; probability distribution interpreted accordingly'
    confidence: high
    corroborating_evidence_ids:
      - evidence-code-acquisition-xor-convention
    conflicting_evidence_ids: []
    used_by_claim_ids:
      - claim-leaf-spam-free-spectrum
    used_by_operation_ids:
      - op-xor-correct-and-aggregate-counts
    participant_requirement_allowed: true
    notes: >-
      The participant contract discloses decimal masks under one LSB convention;
      it does not require knowledge of Qiskit's displayed bit-string order.

  - evidence_id: evidence-code-acquisition-xor-convention
    type: code
    statement: >-
      The official acquisition notebooks save randomized X masks, XOR observed
      outcomes with those masks, adapt Qiskit's rightmost-Q0 display order before
      XOR, and emit histograms in integer-key order.
    origin_class: code_present
    source:
      source_id: repo-query-ibmq
      locator_type: immutable-commit-url-line-ranges
      locator:
        commit: d73e1002f5f0ec35f54bf47c338f8c28eaaaa954
        urls:
          - https://github.com/rharper2/query_ibmq/blob/d73e1002f5f0ec35f54bf47c338f8c28eaaaa954/createAndRunCircuits.ipynb#L130-L137
          - https://github.com/rharper2/query_ibmq/blob/d73e1002f5f0ec35f54bf47c338f8c28eaaaa954/createAndRunCircuits.ipynb#L199-L211
          - https://github.com/rharper2/query_ibmq/blob/d73e1002f5f0ec35f54bf47c338f8c28eaaaa954/createAndRunCircuits.ipynb#L265-L287
          - https://github.com/rharper2/query_ibmq/blob/d73e1002f5f0ec35f54bf47c338f8c28eaaaa954/createAndRunCircuits.ipynb#L561-L564
          - https://github.com/rharper2/query_ibmq/blob/d73e1002f5f0ec35f54bf47c338f8c28eaaaa954/PickleExtractor.ipynb#L210-L229
          - https://github.com/rharper2/query_ibmq/blob/d73e1002f5f0ec35f54bf47c338f8c28eaaaa954/PickleExtractor.ipynb#L238-L238
          - https://github.com/rharper2/query_ibmq/blob/d73e1002f5f0ec35f54bf47c338f8c28eaaaa954/PickleExtractor.ipynb#L399-L406
    exact_quote_or_value: 'observed XOR target after Qiskit string-order adaptation; integer-ordered output keys'
    confidence: high
    corroborating_evidence_ids:
      - evidence-paper-randomized-x-mask
    conflicting_evidence_ids: []
    used_by_claim_ids:
      - claim-leaf-spam-free-spectrum
    used_by_operation_ids:
      - op-xor-correct-and-aggregate-counts
    participant_requirement_allowed: false
    notes: >-
      The repository was inspected at an immutable remote commit but not retained.
      Public decimal masks already share the disclosed LSB convention, so direct
      integer XOR is correct and no participant-side reversal is allowed.

  - evidence_id: evidence-paper-five-stage-protocol
    type: protocol
    statement: >-
      The reported workflow estimates outcome distributions by sequence length,
      applies a Walsh-Hadamard transform, fits exponential decays, transforms
      back, and projects onto the probability simplex.
    origin_class: paper_reported
    source:
      source_id: arxiv-1907.13022v2
      locator_type: path-lines
      locator:
        path: authoring/sources/paper_source/noiseLearningArxiv.tex
        start_line: 157
        end_line: 168
        section: main text
        figure: Figure 1
    exact_quote_or_value: 'estimate outcomes; Walsh-Hadamard transform; exponential fit; inverse transform; simplex projection'
    confidence: high
    corroborating_evidence_ids:
      - evidence-code-transform-fit-project
    conflicting_evidence_ids: []
    used_by_claim_ids:
      - claim-leaf-spam-free-spectrum
      - claim-leaf-long-range-correlations-and-local-model-mismatch
    used_by_operation_ids:
      - op-xor-correct-and-aggregate-counts
      - op-transform-length-histograms
      - op-fit-nuisance-decays
      - op-reconstruct-simplex-distribution
    participant_requirement_allowed: true
    notes: Scientific stages and conventions needed by the task must be disclosed publicly.

  - evidence_id: evidence-paper-decay-model
    type: equation
    statement: >-
      Each transformed mode is fitted to a nuisance-amplitude exponential model
      A times p to the sequence length, yielding SPAM-free decay estimates.
    origin_class: paper_reported
    source:
      source_id: arxiv-1907.13022v2
      locator_type: path-lines
      locator:
        path: authoring/sources/paper_source/noiseLearningArxiv.tex
        start_line: 1497
        end_line: 1510
        section: Protocol to measure all single-qubit f parameters simultaneously
        equation: 'bar p(m) = A p^m'
    exact_quote_or_value: 'bar p(m) = A p^m'
    confidence: high
    corroborating_evidence_ids:
      - evidence-paper-five-stage-protocol
      - evidence-code-transform-fit-project
    conflicting_evidence_ids:
      - evidence-paper-fit-cutoff-ambiguity
    used_by_claim_ids:
      - claim-leaf-spam-free-spectrum
    used_by_operation_ids:
      - op-fit-nuisance-decays
    participant_requirement_allowed: true
    notes: >-
      The selected spectral task uses this disclosed model on synthetic hidden
      instances. Its public all-length fit is a benchmark choice because the
      paper's own fit-truncation symbols are not self-contained.

  - evidence_id: evidence-paper-fit-cutoff-ambiguity
    type: limitation
