conflicts:
  - conflict_id: conflict-jsd-square-root
    topic: Jensen-Shannon distance versus divergence
    paper_statement: >-
      Methods lines 1067-1071 and 1118-1125 define natural-log KL and take the
      square root of the symmetric Jensen-Shannon divergence.
    code_behavior: >-
      Juqst.jl src/marginal.jl lines 478-516 uses log2 and returns the symmetric
      divergence without a square root.
    observed_behavior: source definitions disagree before execution
    resolution: benchmark-choice
    rationale: >-
      The spectral task publicly specifies square-root JSD using natural logs;
      evaluator references must implement that disclosed convention.

  - conflict_id: conflict-jsd-main-text-bound
    topic: JSD log-base convention
    paper_statement: >-
      Main-text line 249 says JSD is in [0,1] if log2 is used, while Methods
      defines KL with natural logarithms.
    code_behavior: Juqst.jl uses log2 internally.
    observed_behavior: two paper locations and code use different scale conventions
    resolution: benchmark-choice
    rationale: The public task fixes one scale and does not ask for paper-reported values.

  - conflict_id: conflict-dependence-log-base
    topic: mutual-information and conditional-mutual-information log base
    paper_statement: >-
      Methods lines 1076-1095 defines MI with ln and CMI with the surrounding
      natural-log information convention.
    code_behavior: >-
      Juqst.jl src/marginal.jl lines 449-470 and 589-600 computes the MI and CMI
      summands with log2.
    observed_behavior: paper and official code differ by a constant scale factor
    resolution: benchmark-choice
    rationale: >-
      The spectral participant contract explicitly defines both MI and CMI in
      natural-log units; references and evaluator recomputation use that disclosed
      scale.

  - conflict_id: conflict-reconstruct-hardcoded-14
    topic: general-size GRF reconstruction
    paper_statement: Bounded-degree GRF learning is claimed polynomial in system size.
    code_behavior: >-
      Juqst.jl src/marginal.jl lines 538-542 enumerates tomatch from 0 to
      2^14-1 regardless of input dimension.
    observed_behavior: static inspection shows a 14-qubit constant
    resolution: benchmark-choice
    rationale: >-
      Selected local-model task requires size-generic nonenumerative inference
      and does not expose or reuse this helper.

  - conflict_id: conflict-paper-source-case
    topic: portable paper-source compilation
    paper_statement: TeX line 172 includes figures/figure2.pdf.
    code_behavior: The extracted archive contains figures/Figure2.pdf.
    observed_behavior: case-sensitive systems cannot resolve that include path unchanged
    resolution: unresolved
    rationale: Recorded source defect; compilation is not required for task verification.

  - conflict_id: conflict-data-snapshot-incomplete
    topic: official dataset availability
    paper_statement: >-
      Data Availability and the data README point to the repository and say the
      data are in data.zip with a notebook reader.
    code_behavior: The pinned commit names data.zip and notebook files.
    observed_behavior: >-
      The local partial/sparse worktree contains only four root files and lacks
      data.zip and all notebooks. The exact 311,764,270-byte data.zip LFS object
      is present under .git/lfs, but the non-LFS notebook blobs are absent and
      could not be hydrated offline. Dryad version 5, immutable internal version
      70586, independently pins data.zip, jupyter_notebook.zip, Linear_Chain.nb,
      and README with exact SHA-256 digests.
    resolution: benchmark-choice
    rationale: >-
      Do not use the incomplete empirical dataset in either selected task;
      generate neutral synthetic instances with independent trusted code.

  - conflict_id: conflict-source-environment-unpinned
    topic: source execution reproducibility
    paper_statement: The paper points to code/notebooks but does not pin a runtime image.
    code_behavior: Project/Manifest files exist but omit an exact Julia runtime version.
    observed_behavior: >-
      The notebook identifies Mathematica 11.1 and a 12.1 Mac front end, but
      its FiniteFields package version and a portable runtime are not pinned.
    resolution: benchmark-choice
    rationale: Use a separately declared Python participant environment.

  - conflict_id: conflict-figure4-metric-and-fit
    topic: Figure 4 metric identity and scaling fit
    paper_statement: >-
      Figure 4 caption, TeX lines 215-220, labels the streams Hellinger and JSD
      and says both orange curves fit a*sqrt(L).
    code_behavior: >-
      Figure4.wl lines 1-8 labels the streams Hellinger and D(q||p).
      Linear_Chain.nb lines 4144-4181 fits Hellinger to a*sqrt(L), while lines
      4750-4786 fit 1000*D(q||p) to a*L.
    observed_behavior: >-
      Saved coefficients are 0.003066702582151935 and 0.049710497328741915;
      they do not establish the caption's exact JSD square-root claim.
    resolution: unresolved
    rationale: >-
      Figure 4 is qualitative grounding only and must not supply an exact hidden
      metric or fit-shape oracle.

  - conflict_id: conflict-figure4-indexing
    topic: Figure 4 chain-length indexing
    paper_statement: The caption describes chain lengths through L=100.
    code_behavior: >-
      Stored data are 20 by 97, naturally representing L=4..100, while the
      notebook plotting/fitting selection omits an endpoint through its index range.
    observed_behavior: >-
      The saved Hellinger coefficient follows the notebook indexing; a derived
      all-row L=4..100 fit gives 0.0029796361369755216 instead.
    resolution: unresolved
    rationale: Do not grade reproduction of the reported coefficient.

  - conflict_id: conflict-supplement-xy-typo
    topic: two-qubit synthetic correlation probability
    paper_statement: TeX line 1904 says XY is changed from 0.0004125 to 0.0006.
    code_behavior: >-
      Table V at lines 1925-1931 uses XY=0.006 and II=0.899275; downstream
      observed probabilities and correlation 0.0639497067 follow 0.006.
    observed_behavior: internal arithmetic supports 0.006, not 0.0006
    resolution: observed
    rationale: >-
      Treat 0.0006 as a typographical error; do not expose this paper-specific
      micro-case as a final task.

  - conflict_id: conflict-grf-zero-support
    topic: zero-support handling in GRF factors
    paper_statement: The paper assumes a strictly positive GRF.
    code_behavior: >-
      Juqst.jl marginal.jl lines 296-300 and 348-373 replaces zero separators
      by 1e-8 and mean-fills undefined conditional columns.
    observed_behavior: static inspection shows heuristic, estimator-dependent behavior
    resolution: benchmark-choice
    rationale: >-
      The local task must publicly specify its own smoothing/support rule and
      evaluator objective instead of copying this arbitrary heuristic.

  - conflict_id: conflict-notebook-bootstrap-copy-paste
    topic: two-qubit bootstrap correlation intervals
    paper_statement: Distinct two-qubit layouts have their own bootstrap uncertainty estimates.
    code_behavior: >-
      TwoQubitGatesRuns.ipynb lines 1743-1748 calculates run-2 and run-3 bounds
      from corrmatsRV1 rather than corrmatsRV2 and corrmatsRV3.
    observed_behavior: static inspection shows a copy-paste defect
    resolution: unresolved
    rationale: Official notebook intervals are not used as evaluator references.

  - conflict_id: conflict-notebook-saved-error
    topic: executable state of the official two-qubit notebook
    paper_statement: Code Availability points to notebooks recreating graphs.
    code_behavior: >-
      TwoQubitGatesRuns.ipynb lines 2344-2358 contains a saved UndefVarError
      stating that Marginal is not defined.
    observed_behavior: the pinned notebook contains an error output
    resolution: unresolved
    rationale: The notebook is evidence only and was not executed.

  - conflict_id: conflict-embedded-git-packaging
    topic: self-contained source snapshot packaging
    paper_statement: not applicable
    code_behavior: Both authoring source directories contain embedded .git repositories.
    observed_behavior: >-
      Parent Git may record gitlinks rather than bytes, and ordinary Git rejects
      the directories as dubious ownership unless safe.directory is supplied.
      The retained source tree totals 1,050,687,836 bytes, including 750,954,151
      bytes of nested Git metadata.
    resolution: observed
    rationale: >-
      The snapshots remain local author evidence and keep their exact manifest
      pins, but authoring/sources/.gitignore excludes them from the parent Git
      tree. git check-ignore confirms the paper and both provider repositories,
       so accidental gitlinks or participant-visible source bytes are prevented.

  - conflict_id: conflict-fit-cutoff-symbols
    topic: decay-fit data-retention cutoffs
    paper_statement: >-
      Supplement TeX line 1197 discards a single-qubit fit when the final point is
      below `(p_1+1/16)/4`, while line 1211 uses `(p_0+1/16)/4` for two-qubit
      fits. Neither symbol is defined locally, and the symbol changes between the
      two otherwise parallel prescriptions.
    code_behavior: not_relied_upon_for_the_selected_benchmark
    observed_behavior: the paper does not supply a self-contained cutoff rule
    resolution: benchmark-choice
    rationale: >-
      The spectral task publicly requires a conditioned fit over all disclosed
      lengths and grades the disclosed observation model behaviorally. It does
      not import an undefined paper cutoff or use one as hidden oracle truth.

  - conflict_id: conflict-experimental-run-count
    topic: number of experimental runs per configuration
    paper_statement: >-
      Supplement TeX line 1206 says 1924 submissions were made for each of three
      configurations, whereas line 2140 says 973 jobs produced 1946 runs per
      configuration.
    code_behavior: no_selected_task_depends_on_the_reported_run_count
    observed_behavior: the two paper locations differ by 22 runs per configuration
    resolution: unresolved
    rationale: >-
      The selected tasks use neutral synthetic instances and do not treat either
      count as evaluator truth or participant-required knowledge.

  - conflict_id: conflict-simulation-grid-and-shots
    topic: simulation sequence-length grid and shot count
    paper_statement: >-
      Figure 8 caption at TeX lines 1558-1559 says 50 sequences were run at 11
      gate lengths. Supplement line 2097 instead describes lengths `1, 3, 5 up
      to 22 gates`, 50 sequences, and 8096 shots per sequence; that progression
      does not uniquely specify 11 integer lengths.
    code_behavior: no_selected_task_uses_the_reported_grid_or_shot_count
    observed_behavior: the prose does not uniquely determine the reported simulation design
    resolution: unresolved
    rationale: >-
      Hidden synthetic grids and shot totals are generated under the public task
      bounds. The ambiguous paper values are evidence limitations, not secrets
      that participants must infer.

license_and_privacy_decision:
  participant_assets_redistributable: true
  restricted_assets:
    - paper PDF/source, retained in authoring only because the arXiv distribution license is not a general public reuse license
    - official source repositories, excluded from participant package despite MIT/CC0 status
    - remotely audited query_ibmq repository, not retained or redistributed
    - incomplete empirical dataset snapshot, excluded from participant package
  sensitive_or_personal_data_present: unknown_due_to_uninspected_pickle_archive
  participant_and_retained_public_assets_sensitive_or_personal_data_present: false
  uninspected_pickle_archive_personal_data_status: unknown_not_deserialized_or_content_audited
  decision: eligible
  notes: >-
    Both selected tasks use newly generated neutral synthetic inputs. No paper,
    repository, device-identifying metadata, source figure, reported value, or
    official data byte is needed by or copied into participant packages.
