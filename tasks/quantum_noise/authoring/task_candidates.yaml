selected_candidate_ids:
  - candidate-spectral-correlation-audit
  - candidate-scalable-local-noise-model

selection_rationale: >-
  The selected candidates are distinct long-horizon slices: one reconstructs a
  small-to-medium explicit error distribution from raw randomized count decays
  and audits nonlocal structure, while the other starts from noisy local tables
  and performs bounded-width reconciliation, inference, and held-out anomaly
  analysis at sizes where full enumeration is infeasible. The four alternatives
  are rejected for missing source bytes and leakage, source conflicts and
  clone-and-run behavior, an open non-identifiable target, or insufficient depth.
  Selection is for build and verification only; neither task is accepted until
  all runtime, clean-room, paper-blind, mutant, metamorphic, and leakage gates pass.
