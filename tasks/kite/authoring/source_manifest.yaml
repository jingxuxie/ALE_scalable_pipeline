conflicts:
  - conflict_id: "conflict-license-001"
    topic: "official source license declaration"
    paper_statement: "The paper describes KITE as open source and points to Zenodo."
    code_behavior: "LICENSE.md contains LGPL-3.0; README says GPL-3.0."
    observed_behavior: "Zenodo metadata uses other-open and its description says GPL-3.0."
    resolution: "benchmark-choice"
    rationale: "No upstream source bytes or code are placed in participant packages; all participant assets are independently authored synthetic data and code."
  - conflict_id: "conflict-moment-normalization-002"
    topic: "Chebyshev moment normalization"
    paper_statement: "Printed Eqs. 2.7 and 2.17 use a factor inconsistent with Eqs. 2.12 and 2.16."
    code_behavior: "tools/src/dos.cpp reconstructs stored raw moments with the required n=0 divisor; tools/src/functions.cpp applies the same divisor to Green coefficients."
    observed_behavior: "Independent dense-eigensystem checks support the raw-moment convention used in the benchmark."
    resolution: "benchmark-choice"
    rationale: "The participant specification discloses an unambiguous raw-moment convention and is graded against independent oracles."
  - conflict_id: "conflict-release-tag-003"
    topic: "v1.0 repository tag naming"
    paper_statement: "The cited Zenodo software is KITE version 1.0."
    code_behavior: "The current Git repository exposes tags 0.1 and 1.1, while Zenodo links to a historical tree/1.0 URL."
    observed_behavior: "The Zenodo archive root identifies commit 7bb1fc4, resolved to full commit 7bb1fc44d2b5a67ef65524fe33702e9c2cdef416."
    resolution: "observed"
    rationale: "The immutable Zenodo archive, checksum, and resolved commit are the pinned source."
  - conflict_id: "conflict-time-phase-004"
    topic: "Chebyshev-Bessel time-propagation phase"
    paper_statement: "Equation 4.13 prints c_n=(-1)^n J_n(delta_e_minus*t/hbar)."
    code_behavior: "Src/SimulationGaussianWavePacket.cpp:135-138 uses pow(-i,n), the standard unitary expansion coefficient."
    observed_behavior: "Independent dense unitary propagation agrees with (-i)^n and not with (-1)^n."
    resolution: "benchmark-choice"
    rationale: "The participant task explicitly states (-i)^n; no paper lookup is required."
  - conflict_id: "conflict-wavepacket-envelope-005"
    topic: "Gaussian wave-packet envelope"
    paper_statement: "Equation 4.15 prints a dimensionally malformed inverse-r-squared exponent."
    code_behavior: "Src/KPM_Vector2D.cpp:235-280 uses exp(-0.5*gauss) with a code-specific lattice-coordinate width."
    observed_behavior: "The benchmark defines exp(-|r-r0|^2/(4*sigma^2)), so sigma is the probability-density standard deviation."
    resolution: "benchmark-choice"
    rationale: "The public amplitude convention is explicit, normalized, and independently verified."

