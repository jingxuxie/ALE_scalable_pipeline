schema_version: paper2ale.codex-workflow-graph/v1

paper:
  paper_id: "arxiv-1910.05194v2"
  title: "KITE: high-performance accurate modelling of electronic structure and response functions of large molecules, disordered crystals and heterostructures"
  source_manifest_path: "authoring/source_manifest.yaml"

claim_tree:
  root:
    id: "claim-root"
    question: "How can sparse tight-binding systems support accurate, reusable electronic-structure and dynamics calculations without dense diagonalization?"
    children:
      - id: "claim-spectral-methods"
        question: "Can polynomial moments reconstruct spectral quantities accurately over energy and resolution queries?"
        children:
          - id: "leaf-spectral-cache"
            type: "finding_leaf"
            statement: "A single energy-independent Chebyshev moment cache can be reused to answer retarded, advanced, and broadened spectral-density queries at new energies, broadenings, and finite prefixes."
            scientific_importance: "central"
            supporting_artifact_ids: ["artifact-spectral-moments", "artifact-spectral-response", "artifact-spectral-diagnostics"]
            reported_evidence_ids: ["evidence-004", "evidence-006", "evidence-008"]
            private_instance_potential: "high"
          - id: "leaf-hall-response"
            type: "finding_leaf"
            statement: "A spin-orbit-coupled exchange model supports a quantized Hall plateau that is degraded by disorder."
            scientific_importance: "supporting"
            supporting_artifact_ids: ["artifact-hall-moments", "artifact-hall-curves", "artifact-hall-report"]
            reported_evidence_ids: ["evidence-023"]
            private_instance_potential: "medium"
          - id: "leaf-matrix-free-equivalence"
            type: "finding_leaf"
            statement: "Pattern-encoded, decomposed Hamiltonian application is numerically equivalent to an explicit sparse operator across valid partitions."
            scientific_importance: "diagnostic"
            supporting_artifact_ids: ["artifact-matrix-checkpoints", "artifact-matrix-moments", "artifact-matrix-counters"]
            reported_evidence_ids: ["evidence-024"]
            private_instance_potential: "high"
      - id: "claim-dynamics"
        question: "Can Chebyshev time propagation recover coupled spin and spatial dynamics in disordered spinful lattices?"
        children:
          - id: "leaf-spin-precession"
            type: "finding_leaf"
            statement: "Bond-directed spin-orbit coupling produces anisotropic spin precession, and an additional Ising disorder field changes the precession axis and ensemble trajectory."
            scientific_importance: "central"
            supporting_artifact_ids: ["artifact-spin-basis", "artifact-spin-trajectories", "artifact-spin-ensemble", "artifact-spin-analysis"]
            reported_evidence_ids: ["evidence-010", "evidence-011", "evidence-012", "evidence-013", "evidence-014"]
            private_instance_potential: "high"
          - id: "leaf-momentum-spectrum"
            type: "finding_leaf"
            statement: "Bias, spin-orbit coupling, and disorder respectively open, split, and broaden momentum-resolved spectral bands."
            scientific_importance: "supporting"
            supporting_artifact_ids: ["artifact-momentum-map", "artifact-momentum-ridges", "artifact-momentum-report"]
            reported_evidence_ids: ["evidence-025"]
            private_instance_potential: "medium"

