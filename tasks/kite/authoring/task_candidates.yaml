selected_candidate_ids:
  - "candidate-01-spectral-cache"
  - "candidate-02-spin-dynamics"

selection_rationale: >
  The two selected tasks are complementary rather than split leaf questions. Each retains a
  complete application-to-numerics backward slice, uses synthetic instances that source lookup
  cannot answer, supports private reuse queries without executing participant code, and has an
  independent oracle plus realistic mutation surface. The response and momentum-spectrum
  candidates were not forced through higher specification or finite-size risk.
