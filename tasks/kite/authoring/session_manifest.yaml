schema_version: paper2ale.codex-session/v1

session:
  paper_id: "arxiv-1910.05194v2"
  paper_path_or_url: "https://arxiv.org/abs/1910.05194"
  supplement_path_or_url: null
  official_code_hint: "https://doi.org/10.5281/zenodo.3485089"
  data_hint: "Official v1.0 examples and paper configurations are in the Zenodo archive."
  output_root: "tasks/kite"
  preferred_task_count: 2
  maximum_task_count: 2
  priority: "hard_only"
  overwrite: false

source_policy:
  find_official_code: true
  find_official_data: true
  pin_exact_versions: true
  record_licenses: true
  permit_unofficial_forks: false
  allow_synthetic_inputs_when_grounded: true
  allow_paper_only_reconstruction: true

task_policy:
  allowed_modes:
    - "masked_workflow_completion"
    - "method_masked_rediscovery"
    - "comparison_and_ablation"
    - "debugging_and_repair"
    - "transfer"
    - "audit"
  prefer_one_strong_task: true
  use_leaf_as_target_not_default_task_boundary: true
  minimum_meaningful_operations: 4
  minimum_dependency_depth: 3
  minimum_independent_challenge_sources: 2
  require_private_generalization_test: true
  require_multiple_output_artifacts_when_natural: true
  reject_easy_and_medium_final_tasks: true
  retain_intermediate_results_as_private_rubrics: true

participant_environment:
  os: "Windows 11 or Linux with Python 3.11+"
  cpu_count: 4
  memory_gb: 8
  gpu: null
  wall_time_minutes: 30
  disk_gb: 2
  network:
    enabled: false
    allowlist: []
  allowed_languages:
    - "python"
  required_packages:
    - "numpy==2.3.5"

verification_policy:
  require_privileged_oracle: true
  require_public_input_reference_solver: true
  require_alternative_valid_solution_when_practical: true
  require_realistic_mutants: true
  minimum_mutant_categories: 5
  require_metamorphic_tests_when_applicable: true
  require_repeated_deterministic_evaluator_runs: true
  numeric_comparison: "calibrated_abs_and_rel_tolerance"
  stochastic_comparison: "fixed_public_probes_or_multiple_realizations"
  scientific_metrics_use_continuous_scores: true
  exact_hidden_thresholds_private: true

difficulty_policy:
  provisional_label: "structurally_hard_candidate"
  require_shortcut_audit: true
  require_clean_room_run: true
  require_frontier_agent_calibration_for_frontier_claim: true

release_policy:
  default_status_without_agent_calibration: "needs_agent_calibration"
  fail_on_specification_gap: true
  fail_on_reference_solver_failure: true
  fail_on_mutant_acceptance: true
  fail_on_hidden_information_leakage: true
  allow_no_viable_task_outcome: true
