selection_rationale: >
  The governing preference remains one excellent long-horizon task over several
  weak tasks. Both selected candidates independently pass their complete local
  verification suites and are accepted for collaborator review as provisional
  structurally hard candidates. They test complementary long workflow slices:
  realization-aware finite-size spectral scaling and joint small-sector spectral
  and eigenstate evidence. Neither candidate is approved for production release
  or a frontier-difficulty claim until deployment review and agent calibration.
