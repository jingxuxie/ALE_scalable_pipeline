    - id: "artifact-dsa-realizations"
      role: "intermediate"
      origin: "participant"
      visibility: "private_rubric"
      format: "in-memory per-record means used for equal-realization aggregation"
      provenance_ids: ["evidence-realization-first-binning", "evidence-dsa-small-system-extension"]
      supports_claim_leaf_ids: ["leaf-joint-finite-size-signatures"]

