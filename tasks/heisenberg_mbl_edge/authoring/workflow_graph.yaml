      provenance_ids: ["evidence-dsa-small-system-extension", "evidence-dsa-finite-size-only"]
      supports_claim_leaf_ids: ["leaf-joint-finite-size-signatures"]

    - id: "artifact-dsa-conclusion"
      role: "output_section"
      origin: "participant"
      visibility: "participant_output"
      format: "RESULT_JSON.conclusions"
      provenance_ids: ["evidence-finite-size-caveat", "evidence-dsa-finite-size-only"]
      supports_claim_leaf_ids: ["leaf-joint-finite-size-signatures"]

    - id: "artifact-dsa-private-score"
      role: "evaluation"
      origin: "private_evaluator"
      visibility: "private"
      format: "structured score and diagnostics"
      provenance_ids: ["evidence-dsa-small-system-extension", "evidence-dsa-finite-size-only"]

    - id: "artifact-proposed-entanglement-ridge-table"
      role: "proposed_output"
      origin: "candidate_only"
      visibility: "author_only"
      format: "table or digitized curve"
      provenance_ids: ["evidence-entanglement-scaling", "evidence-ee-sigma-ambiguity"]
      supports_claim_leaf_ids: ["leaf-entanglement-ridge"]

    - id: "artifact-proposed-l22-eigenpairs"
      role: "proposed_output"
      origin: "candidate_only"
      visibility: "author_only"
      format: "production-scale eigenpairs and statistics"
      provenance_ids: ["evidence-shift-invert-sampling", "evidence-missing-numerical-details", "evidence-no-2015-code-data"]
      supports_claim_leaf_ids: ["leaf-l22-shiftinvert-reproduction"]

  operations:
    - id: "op-paper-model"
      name: "Instantiate disorder realizations and fixed-magnetization Hamiltonians"
      authority: "source_authors"
      inputs: ["artifact-paper-model-spec", "artifact-paper-disorder-realizations"]
      outputs: ["artifact-paper-sector-hamiltonians"]
      tool: "unreleased implementation"
      meaningful_operation: true
      stochastic: true
      estimated_runtime_minutes: null
      provenance_ids: ["evidence-model-hamiltonian", "evidence-sectors-energy-coordinate", "evidence-no-2015-code-data"]
      origin_class: "paper_reported"

    - id: "op-paper-energy-targeting"
      name: "Compute extremal energies and per-realization normalized targets"
      authority: "source_authors"
      inputs: ["artifact-paper-sector-hamiltonians"]
      outputs: ["artifact-paper-energy-targets"]
      tool: "unreleased eigensolver workflow"
      meaningful_operation: true
      stochastic: false
      estimated_runtime_minutes: null
      provenance_ids: ["evidence-sectors-energy-coordinate", "evidence-shift-invert-sampling"]
      origin_class: "paper_reported"

    - id: "op-paper-eigenpairs"
      name: "Solve targeted interior eigenpairs by shift-invert Krylov methods"
      authority: "source_authors"
      inputs: ["artifact-paper-sector-hamiltonians", "artifact-paper-energy-targets"]
      outputs: ["artifact-paper-eigenpairs"]
      tool: "PETSc/SLEPc plus MUMPS, exact settings unreleased"
      meaningful_operation: true
      stochastic: false
      estimated_runtime_minutes: null
      provenance_ids: ["evidence-shift-invert-sampling", "evidence-missing-numerical-details"]
      origin_class: "paper_reported"

    - id: "op-paper-gap-ratio"
      name: "Compute adjacent-gap ratios"
      authority: "source_authors"
