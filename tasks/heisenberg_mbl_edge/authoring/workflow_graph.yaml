      supports_claim_leaf_ids: ["leaf-gap-ratio-fss-audit"]

    - id: "artifact-ssa-private-score"
      role: "evaluation"
      origin: "private_evaluator"
      visibility: "private"
      format: "structured score and diagnostics"
      provenance_ids: ["evidence-ssa-generated-extension", "evidence-ssa-method-freedom"]

    - id: "artifact-dsa-public-experiments"
      role: "input"
      origin: "grounded_extension_asset"
      visibility: "participant"
      format: "experiment.json with IDs, L, n_up, exchange, fields, queries, subsystems, and comparisons"
      provenance_ids: ["evidence-dsa-small-system-extension", "evidence-model-hamiltonian"]

    - id: "artifact-dsa-solution-source"
      role: "output"
      origin: "participant"
      visibility: "participant_output"
      format: "output/solution.py"
      provenance_ids: ["evidence-dsa-small-system-extension"]

    - id: "artifact-dsa-normalized-experiments"
      role: "intermediate"
      origin: "participant"
      visibility: "private_rubric"
      format: "validated in-memory experiment records"
      provenance_ids: ["evidence-dsa-small-system-extension"]

    - id: "artifact-dsa-sector-bases"
      role: "intermediate"
      origin: "participant"
      visibility: "private_rubric"
      format: "ordered fixed-n_up bit bases"
      provenance_ids: ["evidence-sectors-energy-coordinate", "evidence-odd-sector-ambiguity"]

    - id: "artifact-dsa-hamiltonians"
      role: "intermediate"
      origin: "participant"
      visibility: "private_rubric"
      format: "dense real-symmetric matrices"
      provenance_ids: ["evidence-model-hamiltonian", "evidence-dsa-small-system-extension"]

    - id: "artifact-dsa-eigensystems"
      role: "intermediate"
      origin: "participant"
      visibility: "private_rubric"
