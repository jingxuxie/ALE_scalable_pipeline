      authority: "source_authors"
      inputs: ["artifact-paper-ensemble-curves", "artifact-paper-fss-fits", "artifact-paper-stability-scan", "artifact-paper-uncertainty"]
      outputs: ["artifact-paper-phase-evidence"]
      tool: "scientific synthesis"
      meaningful_operation: true
      stochastic: false
      estimated_runtime_minutes: null
      provenance_ids: ["evidence-mobility-edge-claim", "evidence-finite-size-caveat", "evidence-dynamic-fraction"]
      origin_class: "paper_reported"

    - id: "op-ssa-parse"
      name: "Validate case schema and select energies nearest each per-realization normalized target"
      authority: "participant"
      inputs: ["artifact-ssa-public-manifest", "artifact-ssa-public-eigenvalues", "artifact-ssa-public-packets", "artifact-ssa-public-queries", "artifact-ssa-public-grid"]
      outputs: ["artifact-ssa-selected-packets"]
      tool: "Python 3.11 and NumPy"
      meaningful_operation: true
      stochastic: false
      estimated_runtime_minutes: 2
      provenance_ids: ["evidence-sectors-energy-coordinate", "evidence-ssa-generated-extension"]
