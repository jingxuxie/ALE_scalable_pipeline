      tool: "Python 3.11 and NumPy"
      meaningful_operation: true
      stochastic: false
      estimated_runtime_minutes: 2
      provenance_ids: ["evidence-gap-ratio-definition", "evidence-ssa-generated-extension"]
      origin_class: "grounded_extension"

    - id: "op-ssa-bin"
      name: "Aggregate within realization before group means and standard errors"
      authority: "participant"
      inputs: ["artifact-ssa-gap-values", "artifact-ssa-selected-packets"]
      outputs: ["artifact-ssa-realization-stats", "artifact-ssa-packet-stats"]
      tool: "Python 3.11 and NumPy"
