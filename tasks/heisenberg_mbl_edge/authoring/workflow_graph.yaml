schema_version: paper2ale.codex-workflow-graph/v1

paper:
  paper_id: "arxiv:1411.0660v2"
  title: "Many-body localization edge in the random-field Heisenberg chain"
  source_manifest_path: "authoring/source_manifest.yaml"

claim_tree:
  root:
    id: "claim-root"
    question: "Which finite-size spectral and eigenstate signatures distinguish weak and strong disorder in the random-field Heisenberg chain, and what can they support about an energy-resolved crossover?"
    children:
      - id: "claim-spectral-statistics"
        question: "Do realization-aware adjacent-gap statistics exhibit a stable finite-size crossover?"
        children:
          - id: "leaf-gap-ratio-fss-audit"
            type: "finding_leaf"
            statement: "A realization-first gap-ratio analysis can locate and audit a finite-size crossover only when packet selection, scaling fits, fit-window stability, uncertainty, and held-out behavior agree."
            scientific_importance: "central"
            supporting_artifact_ids:
              - "artifact-paper-fss-fits"
              - "artifact-paper-stability-scan"
              - "artifact-ssa-transition"
              - "artifact-ssa-stability"
              - "artifact-ssa-predictions"
              - "artifact-ssa-claims"
            reported_evidence_ids:
              - "evidence-gap-ratio-definition"
              - "evidence-gap-ratio-center-result"
              - "evidence-realization-first-binning"
              - "evidence-fss-protocol"
              - "evidence-stability-grid"
              - "evidence-bootstrap-systematics"
              - "evidence-finite-size-caveat"
            private_instance_potential: "high"
          - id: "leaf-l22-shiftinvert-reproduction"
            type: "finding_leaf"
            statement: "Production-scale shift-invert calculations through L=22 reproduce the reported energy-resolved spectral statistics."
            scientific_importance: "supporting"
            supporting_artifact_ids:
              - "artifact-proposed-l22-eigenpairs"
            reported_evidence_ids:
              - "evidence-shift-invert-sampling"
              - "evidence-missing-numerical-details"
              - "evidence-no-2015-code-data"
            private_instance_potential: "low"
      - id: "claim-eigenstate-signatures"
        question: "Do independently computed eigenstate observables corroborate the finite-size spectral distinction?"
        children:
          - id: "leaf-joint-finite-size-signatures"
            type: "finding_leaf"
            statement: "For fully specified small disordered sectors, weak- and strong-disorder groups show jointly distinguishable finite-size spectral and eigenstate signatures without requiring a thermodynamic mobility-edge claim."
            scientific_importance: "central"
            supporting_artifact_ids:
              - "artifact-dsa-states"
              - "artifact-dsa-realizations"
              - "artifact-dsa-ensembles"
              - "artifact-dsa-conclusion"
            reported_evidence_ids:
              - "evidence-model-hamiltonian"
              - "evidence-sectors-energy-coordinate"
              - "evidence-gap-ratio-definition"
              - "evidence-entanglement-scaling"
              - "evidence-bipartite-fluctuation-result"
              - "evidence-participation-result"
              - "evidence-realization-first-binning"
              - "evidence-finite-size-caveat"
              - "evidence-dsa-small-system-extension"
              - "evidence-dsa-finite-size-only"
            private_instance_potential: "high"
          - id: "leaf-entanglement-ridge"
            type: "finding_leaf"
            statement: "A tabulation of the reported half-chain entanglement fluctuation ridge locates the finite-size transition."
            scientific_importance: "diagnostic"
            supporting_artifact_ids:
              - "artifact-proposed-entanglement-ridge-table"
            reported_evidence_ids:
              - "evidence-entanglement-scaling"
              - "evidence-ee-sigma-ambiguity"
            private_instance_potential: "low"
          - id: "leaf-no-true-hilbert-localization"
            type: "finding_leaf"
            statement: "Accessible-size participation entropy does not establish true localization in Hilbert space."
            scientific_importance: "supporting"
            supporting_artifact_ids:
              - "artifact-paper-participation-samples"
              - "artifact-paper-phase-evidence"
            reported_evidence_ids:
              - "evidence-participation-result"
              - "evidence-no-true-hilbert-localization"
              - "evidence-version-multifractality"
            private_instance_potential: "medium"
      - id: "claim-edge-synthesis"
        question: "Can multiple finite-size observables be reconciled into an energy-resolved phase-boundary interpretation?"
        children:
          - id: "leaf-multiple-observable-consistency"
            type: "finding_leaf"
            statement: "Several reported finite-size observables give broadly consistent energy-resolved crossover estimates, subject to strong finite-size caveats."
            scientific_importance: "central"
            supporting_artifact_ids:
              - "artifact-paper-phase-evidence"
            reported_evidence_ids:
              - "evidence-mobility-edge-claim"
              - "evidence-bipartite-fluctuation-result"
              - "evidence-dynamic-fraction"
              - "evidence-finite-size-caveat"
            private_instance_potential: "medium"

workflow:
  artifacts:
    - id: "artifact-paper-model-spec"
      role: "input"
      origin: "paper"
      visibility: "author_only"
      format: "equation and protocol"
      provenance_ids: ["evidence-model-hamiltonian", "evidence-sectors-energy-coordinate"]

    - id: "artifact-paper-disorder-realizations"
      role: "input"
      origin: "paper"
      visibility: "author_only"
      format: "unreleased realization ensemble"
      provenance_ids: ["evidence-model-hamiltonian", "evidence-no-2015-code-data"]

    - id: "artifact-paper-sector-hamiltonians"
      role: "intermediate"
      origin: "paper"
      visibility: "author_only"
      format: "sparse sector matrices"
      provenance_ids: ["evidence-model-hamiltonian", "evidence-sectors-energy-coordinate"]

    - id: "artifact-paper-energy-targets"
      role: "intermediate"
      origin: "paper"
      visibility: "author_only"
      format: "per-realization normalized target table"
      provenance_ids: ["evidence-sectors-energy-coordinate", "evidence-shift-invert-sampling"]

    - id: "artifact-paper-eigenpairs"
      role: "intermediate"
      origin: "paper"
      visibility: "author_only"
      format: "unreleased eigenvalue/eigenvector packets"
      provenance_ids: ["evidence-shift-invert-sampling", "evidence-no-2015-code-data"]

    - id: "artifact-paper-gap-samples"
      role: "intermediate"
      origin: "paper"
      visibility: "author_only"
      format: "adjacent-gap ratio samples"
      provenance_ids: ["evidence-gap-ratio-definition"]

    - id: "artifact-paper-kl-samples"
      role: "intermediate"
      origin: "paper"
      visibility: "author_only"
      format: "eigenstate KL samples"
      provenance_ids: ["evidence-kl-signatures", "evidence-kl-pairing-gap"]

    - id: "artifact-paper-entanglement-samples"
      role: "intermediate"
      origin: "paper"
      visibility: "author_only"
      format: "half-chain entropy and fluctuation samples"
      provenance_ids: ["evidence-entanglement-scaling", "evidence-ee-sigma-ambiguity", "evidence-bipartite-fluctuation-result"]

    - id: "artifact-paper-participation-samples"
      role: "intermediate"
      origin: "paper"
      visibility: "author_only"
      format: "participation entropy samples"
      provenance_ids: ["evidence-participation-result", "evidence-no-true-hilbert-localization"]
      supports_claim_leaf_ids: ["leaf-no-true-hilbert-localization"]

    - id: "artifact-paper-realization-bins"
      role: "intermediate"
      origin: "paper"
      visibility: "author_only"
      format: "per-realization binned observables"
      provenance_ids: ["evidence-realization-first-binning"]

    - id: "artifact-paper-ensemble-curves"
      role: "intermediate"
      origin: "paper"
      visibility: "author_only"
      format: "ensemble means and standard errors"
      provenance_ids: ["evidence-realization-first-binning"]

    - id: "artifact-paper-fss-fits"
      role: "intermediate"
      origin: "paper"
      visibility: "author_only"
      format: "one-parameter scaling fits"
      provenance_ids: ["evidence-fss-protocol"]
      supports_claim_leaf_ids: ["leaf-gap-ratio-fss-audit"]

    - id: "artifact-paper-stability-scan"
      role: "intermediate"
      origin: "paper"
      visibility: "author_only"
      format: "fit-window and minimum-size scan"
      provenance_ids: ["evidence-stability-grid", "evidence-fit-limitations"]
      supports_claim_leaf_ids: ["leaf-gap-ratio-fss-audit"]

    - id: "artifact-paper-uncertainty"
      role: "intermediate"
      origin: "paper"
      visibility: "author_only"
      format: "bootstrap and systematic uncertainty summary"
      provenance_ids: ["evidence-bootstrap-systematics"]

    - id: "artifact-paper-phase-evidence"
      role: "output"
      origin: "paper"
      visibility: "author_only"
      format: "figures, tables, and qualified conclusions"
      provenance_ids: ["evidence-mobility-edge-claim", "evidence-finite-size-caveat", "evidence-dynamic-fraction"]
