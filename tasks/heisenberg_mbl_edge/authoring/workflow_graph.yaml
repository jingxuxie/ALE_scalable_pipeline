      format: "realization_stats.csv"
      provenance_ids: ["evidence-realization-first-binning", "evidence-ssa-generated-extension"]

    - id: "artifact-ssa-packet-stats"
      role: "output"
      origin: "participant"
      visibility: "participant_output"
      format: "packet_stats.csv"
      provenance_ids: ["evidence-realization-first-binning", "evidence-ssa-generated-extension"]

    - id: "artifact-ssa-transition"
      role: "output"
      origin: "participant"
      visibility: "participant_output"
      format: "transition.csv"
      provenance_ids: ["evidence-fss-protocol", "evidence-ssa-method-freedom"]
