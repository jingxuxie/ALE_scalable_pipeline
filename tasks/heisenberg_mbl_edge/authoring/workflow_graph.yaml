      tool: "unreleased analysis"
      meaningful_operation: true
      stochastic: false
      estimated_runtime_minutes: null
      provenance_ids: ["evidence-gap-ratio-definition", "evidence-gap-ratio-center-result"]
      origin_class: "paper_reported"

    - id: "op-paper-kl"
      name: "Compute eigenvector KL diagnostics"
      authority: "source_authors"
      inputs: ["artifact-paper-eigenpairs"]
      outputs: ["artifact-paper-kl-samples"]
      tool: "unreleased analysis with ambiguous pairing description"
      meaningful_operation: true
      stochastic: true
      estimated_runtime_minutes: null
      provenance_ids: ["evidence-kl-signatures", "evidence-kl-pairing-gap"]
      origin_class: "paper_reported"

    - id: "op-paper-entanglement"
      name: "Compute half-chain entanglement and magnetization fluctuations"
      authority: "source_authors"
      inputs: ["artifact-paper-eigenpairs"]
      outputs: ["artifact-paper-entanglement-samples"]
      tool: "unreleased analysis"
      meaningful_operation: true
      stochastic: false
      estimated_runtime_minutes: null
      provenance_ids: ["evidence-entanglement-scaling", "evidence-ee-sigma-ambiguity", "evidence-bipartite-fluctuation-result"]
      origin_class: "paper_reported"

    - id: "op-paper-participation"
      name: "Compute participation entropies in the computational basis"
      authority: "source_authors"
      inputs: ["artifact-paper-eigenpairs"]
      outputs: ["artifact-paper-participation-samples"]
      tool: "unreleased analysis"
      meaningful_operation: true
      stochastic: false
      estimated_runtime_minutes: null
      provenance_ids: ["evidence-participation-result", "evidence-no-true-hilbert-localization"]
      origin_class: "paper_reported"

    - id: "op-paper-realization-binning"
      name: "Bin state-level observables within each disorder realization"
      authority: "source_authors"
      inputs: ["artifact-paper-gap-samples", "artifact-paper-kl-samples", "artifact-paper-entanglement-samples", "artifact-paper-participation-samples"]
      outputs: ["artifact-paper-realization-bins", "artifact-paper-ensemble-curves"]
      tool: "unreleased analysis"
      meaningful_operation: true
      stochastic: false
      estimated_runtime_minutes: null
      provenance_ids: ["evidence-realization-first-binning"]
      origin_class: "paper_reported"

    - id: "op-paper-fss"
      name: "Fit one-parameter finite-size scaling collapses"
      authority: "source_authors"
      inputs: ["artifact-paper-ensemble-curves"]
      outputs: ["artifact-paper-fss-fits"]
      tool: "cubic scaling-curve fit; optimizer and weighting unreleased"
