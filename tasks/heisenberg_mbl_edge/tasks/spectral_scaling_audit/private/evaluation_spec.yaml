excluded_mutation_candidates:
  - mutant_id: "wrong_group_weight"
    reason: "Public analysis permits independently implemented deterministic response weighting; calibration showed this weighting change remained behaviorally valid, so it is not a required reject mutant."

metamorphic_tests:
  - test_id: "row-packet-permutation"
    applicability: "applicable"
    implementation: "scripts/verify.py creates a semantically identical case with packet rows and matching flat packet slices permuted."
    expected_relation: "All ID-aligned scientific outputs are invariant after canonical sorting for comparison."
  - test_id: "realization-id-bijection"
    applicability: "applicable"
    implementation: "scripts/verify.py applies a one-to-one relabeling of realization IDs."
    expected_relation: "Relabeled realization rows are equivariant and all grouped, transition, stability, prediction, and claim values are invariant."
  - test_id: "positive-affine-energy"
    applicability: "Applicable only for a finite map with 0.5<=a<=2.0, finite b, baseline/transformed magnitudes <=1e100, chunk containment, diagnostic-shift fraction <=0.005, retain-cutoff margin >=max(1e-8*S,2**20*ulp(M)), selected-gap margin >=max(1e-9*S,2**20*ulp(M)), exact stable selected prefix and retained energy order, and maximum retained-ratio perturbation <=1e-10 in both coordinates."
    implementation: "scripts/verify.py applies the calibrated map E'=1.625*E-4.75 only after private/metamorphic/harness.py checks the public float64 predicate against the .17g case that the analyzer will read."
    expected_relation: "Selected levels correspond and every adjacent-gap ratio and downstream result is invariant within numeric tolerance."
  - test_id: "affine-control-covariance"
    applicability: "Applicable only for a>0 transformations for which every canonical transformed analysis halfwidth remains in [0.4,1e6], ten-decimal canonicalization commutes with the chosen map on all keys, transformed keys remain distinct, and every candidate row is more than 1e-8*max(1,halfwidth) from every relevant window boundary before and after transformation."
    implementation: "scripts/verify.py applies h' = a*h+b to observations and queries and scales every canonical analysis halfwidth by a; public window membership remains abs(control-center) <= halfwidth*(1+1e-12)."
    expected_relation: "h_c and its interval transform to a*h_c+b, halfwidth-like quantities transform by a, nu/fit_ok/stable are invariant, and predictions, ratio evidence, and dimensionless residual diagnostics are invariant at transformed queries within numerical tolerance."
  - test_id: "target-mirror-equivariance"
    applicability: "applicable"
    implementation: "scripts/verify.py reflects target to 1-target while consistently remapping packet targeting and query labels."
    expected_relation: "Target-indexed curves and predictions are equivariant under the reflection."
  - test_id: "shard-split-rejoin"
    applicability: "applicable"
    implementation: "scripts/verify.py partitions packet records/energy slices and reconstructs a semantically identical case in a different concatenation order."
    expected_relation: "ID-aligned output is invariant to storage sharding and deterministic rejoin order."

metamorphic_negative_controls:
  - test_id: "rejected-affine-preflight"
    input: "positive-affine energy map with scale 3.0 and offset -4.75"
    expected: "The map is rejected with ValueError before its destination case is created because the private allowed scale interval is [0.5,2.0]."
  - test_id: "structured-metamorphic-cli-failure"
    input: "an empty malformed case directory"
    expected: >
      Exit 1, empty stderr, and byte-identical stdout/--report JSON equal to
      {schema_version: spectral-scaling-metamorphic-report/v1, passed: false,
      fatal_error: metamorphic_suite_exception}; the input directory remains
      unchanged and transformed analysis never starts.

determinism:
  repeated_grader_runs: 2
  require_identical_parsed_scores: true
  require_identical_process_status: true

leakage_and_security:
  participant_must_not_access:
    - "private/"
    - "author/"
    - "source paper"
    - "official source repository"
    - "authoring records"
  network_policy: "off"
  path_and_symlink_checks: true
  output_size_limit_bytes: 4000000
  executable_submission_sandbox: >
    Each hidden case is copied into a fresh child-root alongside copied analyzer
    and guard files. Child argv, cwd, and an allowlisted non-secret environment
    contain only staged paths; reference, truth, private-repository, and author
    paths are not exposed. CPython runs in isolated mode through a trusted audit
    hook. Reads are restricted to staged input/analyzer and Python runtime roots;
    writes are restricted to the staged output directory; imports are
    allowlisted; subprocess, network, dynamic execution, unsafe filesystem
    mutation, links, and traversal are denied. Output streams are drained
    concurrently while only bounded tails are retained. All submitted and
    produced files must be regular files with exactly one filesystem link.
    Production ALE must additionally enforce OS-level process, resource,
    filesystem, and network isolation.
