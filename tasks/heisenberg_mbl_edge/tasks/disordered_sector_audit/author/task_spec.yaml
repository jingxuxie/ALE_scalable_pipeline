schema_version: paper2ale.codex-task-spec/v1

task:
  task_id: disordered-sector-audit-v1
  title: Disordered fixed-sector eigensystem audit
  status: needs_agent_calibration
  task_mode: masked_workflow_completion
  derivation_type: reported_model_and_observables_with_grounded_small_system_extension
  target_claim_leaf_id: leaf-joint-finite-size-signatures
  summary: >
    Implement a reusable dense exact-diagonalization pipeline for bounded
    periodic spin sectors, answer multiple withheld energy and real-space
    subsystem queries from each cached eigensystem, aggregate correlated
    packets by disorder realization, and support finite-ensemble weak-versus-
    strong disorder conclusions with recomputable spectral and eigenvector
    evidence. No thermodynamic transition or mobility-edge claim is required.

workflow_subgraph:
  operation_ids:
    - op-dsa-parse
    - op-dsa-enumerate-sector
    - op-dsa-assemble-hamiltonian
    - op-dsa-diagonalize
    - op-dsa-select-packets
    - op-dsa-compute-observables
    - op-dsa-realization-bin
    - op-dsa-ensemble-contrast
    - op-dsa-evidence-report
  public_input_artifact_ids:
    - artifact-dsa-public-experiments
  participant_output_artifact_ids:
    - artifact-dsa-solution-source
    - artifact-dsa-states
    - artifact-dsa-ensembles
    - artifact-dsa-conclusion
  private_rubric_artifact_ids:
    - artifact-dsa-sector-bases
    - artifact-dsa-hamiltonians
    - artifact-dsa-eigensystems
    - artifact-dsa-selected-packets
    - artifact-dsa-states
    - artifact-dsa-realizations
  backward_slice_artifact_ids:
    - artifact-dsa-public-experiments
    - artifact-dsa-solution-source
    - artifact-dsa-normalized-experiments
    - artifact-dsa-sector-bases
    - artifact-dsa-hamiltonians
    - artifact-dsa-eigensystems
    - artifact-dsa-selected-packets
    - artifact-dsa-states
    - artifact-dsa-realizations
    - artifact-dsa-ensembles
    - artifact-dsa-conclusion
  meaningful_operation_count: 9
  dependency_depth: 9
  branch_count: 4
  tool_count: 1
  required_artifact_count: 4

participant:
  task_description_path: participant/TASK.md
  visible_inputs:
    - id: artifact-dsa-public-experiments
      path: participant/input/retired_experiment/experiment.json
      format: json
      purpose: Retired development instance demonstrating the complete input schema.
      source: independently_generated_synthetic_instance
      redistribution_status: allowed
  starter_software:
    - path: participant/software/validate_submission.py
      purpose: Public one-file, safety, size, UTF-8, and syntax validator.
      removed_solution_components:
        - fixed-sector basis and Hamiltonian construction
        - eigensystem caching and energy packet selection
        - entanglement, participation, and magnetization observables
        - clustered aggregation and evidence logic
  environment:
    os: cross_platform
    cpu_count: 4
    memory_gb: 8
    gpu: null
    wall_time_minutes: 20
    disk_gb: 2
    network:
      enabled: false
      allowlist: []
    packages:
      - numpy==2.3.5
  required_outputs:
    - id: artifact-dsa-solution-source
      path: output/solution.py
      format: utf8_python
      delivery: submitted_file
      schema_or_shape: >
        Exactly one regular file, at most 200000 bytes, implementing
        --experiment DIRECTORY --output RESULT_JSON and the disclosed result/v1 schema.
      purpose: Behaviorally evaluated reusable solver for fresh experiment directories.
      required: true
    - id: artifact-dsa-states
      path: RESULT_JSON#/state_rows
      format: json_array_section
      delivery: generated_at_evaluation_runtime
      schema_or_shape: The complete canonical state_rows array in sector-audit-result/v1.
      purpose: State-level spectral and eigenvector evidence generated by the submitted solver for each supplied experiment.
      required: true
    - id: artifact-dsa-ensembles
      path: RESULT_JSON#/aggregate_rows
      format: json_array_section
      delivery: generated_at_evaluation_runtime
      schema_or_shape: The complete canonical aggregate_rows array in sector-audit-result/v1.
      purpose: Realization-first ensemble means and SEM generated by the submitted solver for each supplied experiment.
      required: true
    - id: artifact-dsa-conclusion
      path: RESULT_JSON#/conclusions
      format: json_array_section
      delivery: generated_at_evaluation_runtime
      schema_or_shape: The complete canonical conclusions array in sector-audit-result/v1.
      purpose: Evidence-linked finite-ensemble contrasts generated by the submitted solver for each supplied experiment.
      required: true
  submission_inventory_note: Exactly one file is submitted, output/solution.py; the other three required artifacts are sections of the requested runtime RESULT_JSON and are not additional submission files.
  public_success_criteria:
    - Correct fixed-sector spin-one-half periodic Hamiltonians and full eigensystem reuse.
    - Correct reversed energy targeting, deterministic packets, and adjacent-gap ratios.
    - Natural-log Schmidt, participation, and subsystem magnetization observables.
    - Equal realization weighting, realization-clustered SEM, and evidence consistency.
    - Finite-ensemble conclusions only; no thermodynamic transition claim.
  constraints:
    - Standard library and NumPy 2.3.5 only.
    - CPU-only, no network, no subprocesses, and bounded result/program sizes.
    - Read only the supplied experiment and write only the requested result file.
  prohibited_dependencies:
    - source paper
    - official source repository
    - private evaluator files
    - undeclared network access
    - stale precomputed hidden results

paper_blindness:
  neutralized_identifiers:
    - paper title
    - author names
    - arXiv identifier
    - journal citation
  withheld_author_information:
    - hidden experiment streams and identifiers
    - private oracle state rows and effects
    - exact thresholds, metric weights, mutants, and security probes
  leakage_checks:
    - Recursive participant text scan for title, authors, arXiv, and identifier.
    - Participant inventory allowlist and private/author projection audit.
    - Fresh hidden records use unpublished seeds and query combinations.
  source_lookup_should_not_solve_task: true

specification_closure:
  decisions:
    - decision: Fixed-sector basis ordering and bit-to-site/spin convention
      status: disclosed
      public_location_or_rationale: participant/TASK.md sections 1-2
    - decision: Hamiltonian coefficient, field sign, and periodic boundary
      status: disclosed
      public_location_or_rationale: participant/TASK.md section 2
    - decision: Reversed normalized energy, packet eligibility, tie break, and state rank
      status: disclosed
      public_location_or_rationale: participant/TASK.md section 3
    - decision: Contiguous wraparound partition and complement ordering
      status: disclosed
      public_location_or_rationale: participant/TASK.md sections 1 and 4
    - decision: Natural-log EE, S1, S2, and magnetization moments
      status: disclosed
      public_location_or_rationale: participant/TASK.md section 4
    - decision: Realization-first weighting and sample-SEM convention
      status: disclosed
      public_location_or_rationale: participant/TASK.md section 5
    - decision: Dense versus alternative valid numerical implementation
      status: evaluator_method_agnostic
      public_location_or_rationale: Behavioral tolerances accept equivalent float64 implementations.
    - decision: Output schemas, IDs, ordering, limits, and conclusion semantics
      status: disclosed
      public_location_or_rationale: participant/TASK.md sections 6-8
  all_closed: true
  paper_blind_review:
    reviewer_has_seen_source: false
    task_restatement_correct: true
    material_ambiguities: []
    status: pass
    review_path: author/paper_blind_review.md
  unresolved_items: []

intrinsic_difficulty:
  provisional_label: structurally_hard_candidate
  challenge_sources:
    - Symmetry-sector many-body Hamiltonian construction and reusable dense eigensystems.
    - Tensor-factor reconstruction from a non-tensor-product sector basis.
    - Multiple linked spectral, entanglement, participation, and fluctuation observables.
    - Correlated-packet statistics, unequal packet sizes, and evidence provenance.
    - Generalization to unseen sectors, targets, wraparound cuts, and identifiers.
  non_difficulty_factors:
    - exact formatting beyond a necessary safe schema
    - hidden threshold
    - excessive system size or raw output volume
  shortcut_tests:
    - name: Copy retired results or hard-code public IDs
      result: rejected
      evidence: author/verification_results.json robustness.stale_public_result
    - name: Replace real-space entanglement with computational-basis Shannon entropy
      result: rejected
      evidence: private/mutants/cases/shannon_entanglement
    - name: Treat eigenstates as independent samples
      result: rejected
      evidence: private/mutants/cases/naive_aggregation and sem_over_states
    - name: Copy reported source values
      result: rejected
      evidence: Fresh hidden Hamiltonians and behavioral state-row rubric have no reported-value lookup.
  expected_human_workflow: 8-20 expert hours across physics, numerical linear algebra, statistics, and robust serialization.
  agent_calibration:
    status: not_run
    exact_task_build_id: recorded_by_scripts_verify
    pinned_agent_systems: []

private_evaluation:
  evaluation_spec_path: private/evaluation_spec.yaml
  hidden_input_paths:
    - private/hidden_inputs/hidden_alpha/experiment.json
    - private/hidden_inputs/hidden_beta/experiment.json
    - private/hidden_inputs/hidden_gamma/experiment.json
  reference_paths:
    - private/reference/hidden-alpha-01.json
    - private/reference/hidden-beta-01.json
    - private/reference/hidden-gamma-01.json
  grader_paths:
    - private/grader/grade.py
    - private/grader/core.py
    - private/grader/sandbox_runner.py
  exact_thresholds_private: true
  exact_weights_private: true

reference_generation:
  privileged_oracle:
    path: author/oracle/generate.py
    may_use_source_information: true
    last_run_status: pass
  public_input_reference_solver:
    path: author/reference_solver/solution.py
    reads_only_participant_package: true
    declared_environment_only: true
    last_run_status: pass
    score: 1.0
    runtime_seconds_observed_range: [0.10, 0.30]
    runtime_measurement_scope: Two guarded retired-input runs on the recorded Windows verification host; the range avoids treating incidental timing noise as a build invariant.
  alternative_solver:
    path: author/alternative_solver/solution.py
    available: true
    independence_notes: >
      Vectorized Hamiltonian construction and reduced-density eigendecomposition
      replace the reference bit-loop construction and coefficient-matrix SVD.

instance_generation:
  supported: true
  trusted_generator: private/trusted/generate_instances.py
  private_seed_policy: independent SeedSequence child streams for retired and each hidden suite; rotate to server-secret streams before scored release
  varying_factors:
    - disorder fields and amplitudes
    - nonunit exchange coefficients
    - L and nonzero fixed-magnetization sector
    - reversed energy target and unequal packet size
    - wraparound subsystem start and size
    - opaque experiment, condition, record, comparison, and query identifiers
    - packet size independently varied across queries within each record
    - record and identifier order
  invariants_preserved:
    - finite weak-disorder packets have larger r, EE, S1, and S2 ensemble means than paired strong-disorder packets
    - Hermiticity, periodicity, fixed magnetization, and valid interior packets
    - compared conditions share L, sector, exchange, energy target, and subsystem
    - packet cutoffs and eigengaps remain numerically conditioned
  public_review_instances_retired: true
  grounded_generalization_note: >
    Hidden gamma uses L=12, n_up=5, nonunit exchange, three queries, and packet
    sizes at the disclosed lower/upper bounds. It is a grounded workflow
    generalization, not a reproduction of a reported paper datum.

provenance:
  source_manifest_path: ../../authoring/source_manifest.yaml
  evidence_map_path: ../../authoring/evidence_map.yaml
  workflow_graph_path: ../../authoring/workflow_graph.yaml
  candidate_record_path: ../../authoring/task_candidates.yaml

release:
  verification_report_path: author/verification_report.md
  checklist_complete: false
  decision: needs_agent_calibration
  blocking_issues:
    - Pinned frontier-agent calibration has not been performed.
    - Production OS isolation and peak-RSS measurement remain ALE integration work.
    - Independent scientific expert review remains pending.
