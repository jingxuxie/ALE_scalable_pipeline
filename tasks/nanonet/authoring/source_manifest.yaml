conflicts:
  - conflict_id: "conflict-dos-normalization"
    topic: "Density-of-states normalization"
    paper_statement: "Equation (10) writes DOS = i/pi Tr(G-G^dagger), which evaluates to -2 Im Tr(G)/pi."
    code_behavior: "The silicon transport example accumulates -Tr(Im G_block)/number_of_blocks, with neither the equation's factor nor pi normalization."
    observed_behavior: "The benchmark defines the conventional spinless total DOS as -Im Tr(G)/pi and LDOS as the same trace over each cell block."
    resolution: "benchmark-choice"
    rationale: "The participant-visible convention is dimensionally explicit, partition invariant, and closes a paper/code discrepancy without requiring source access."

  - conflict_id: "conflict-damping-type"
    topic: "Retarded broadening convention"
    paper_statement: "Equation (2) uses E+i0+ and the example passes damp=0.001j."
    code_behavior: "recursive_greens_functions.py adds 1j*damp; an imaginary damp therefore becomes a real energy shift. Other surface routines use E+damp."
    observed_behavior: "Independent oracle and alternative solvers agree when the public contract uses z=E+i*eta with real positive eta."
    resolution: "benchmark-choice"
    rationale: "The explicit retarded convention removes an implementation-dependent double-imaginary ambiguity."

  - conflict_id: "conflict-surface-return-order"
    topic: "Left/right surface self-energy orientation"
    paper_statement: "Equation (8) distinguishes left and right mode-selected self-energies."
    code_behavior: "greens_functions.py documents sgf_l then sgf_r, computes variables with those names, crops opposite ends, and returns sgf_r, sgf_l at line 260."
    observed_behavior: "Nonnormal lead checks distinguish the two orientations and match finite-slab references when outward couplings are explicitly B_left=H1^H and B_right=H1."
    resolution: "benchmark-choice"
    rationale: "The task states both Dyson equations and contact matrices, so orientation is testable without inheriting ambiguous names."

  - conflict_id: "conflict-version-drift"
    topic: "Repository version corresponding to the paper"
    paper_statement: "arXiv v1 is dated 2020-10-15 and cites the official repository."
    code_behavior: "The current checkout is commit 0c71da6 from 2026-08-14 and declares version 1.9.9."
    observed_behavior: "Commit 50d02856 from 2020-09-22 is the nearest located official commit preceding arXiv v1."
    resolution: "observed"
    rationale: "Both snapshots are pinned and differentiated; neither is a participant dependency."

  - conflict_id: "conflict-complex-band-equation"
    topic: "Linearized complex-band equation"
    paper_statement: "Equation (7) prints a lower-left block resembling -H1^{-1}H_{-1} but a lower-right block resembling H1(E-H0), apparently lacking a matching inverse."
    code_behavior: "The implementation solves a generalized eigenproblem rather than literally applying the printed block matrix."
    observed_behavior: "The selected task does not require complex-band eigenvalues; it evaluates direct Hermitian Bloch bands from the explicitly stated H(theta)."
    resolution: "benchmark-choice"
    rationale: "Excluding this ambiguous side branch avoids a hidden reconstruction dependency while retaining the reported periodic-band workflow."

  - conflict_id: "conflict-greedy-optimality"
    topic: "Meaning of optimal block decomposition"
    paper_statement: "The summary calls the recursive greedy construction non-optimal and separately proposes polynomial block-size optimization."
    code_behavior: "find_optimal_cut minimizes a local sum-of-cubes separator objective recursively; no global optimum proof or exhaustive comparator is present."
    observed_behavior: "Static review found little direct test coverage for the optimized splitting path."
    resolution: "unresolved"
    rationale: "The block-optimization candidate was rejected, so this unresolved terminology is not a participant requirement."

  - conflict_id: "conflict-missing-silicon-assets"
    topic: "Exact reproduction of Figure 9"
    paper_statement: "The silicon coordinates are said to be in supplementary material and the example uses predefined silicon/hydrogen parameter tables."
    code_behavior: "The official repository contains SiNW2.xyz and parameter definitions, but those are external to the paper PDF."
    observed_behavior: "No supplementary file or complete silicon parameter table was present in the inspected PDF."
    resolution: "benchmark-choice"
    rationale: "Exact Figure 9 reproduction was rejected. The selected grounded extension publishes all geometry and parameters in neutral synthetic JSON inputs."

