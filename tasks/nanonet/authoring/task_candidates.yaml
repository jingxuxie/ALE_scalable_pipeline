selection_rationale: >
  The preferred count was two, but no second candidate met the hard-only bar
  without either stopping at an easy intermediate, depending on missing paper
  assets, becoming clone-and-run, or requiring an unclosed numerical
  dependency. The selected task folds Hamiltonian assembly, periodic bands,
  causal surfaces, and finite-device transport into one coherent backward
  slice with eight meaningful operations, two independent numerical challenge
  sources, diverse hidden generalization, and four behaviorally scored
  artifacts. It remains a structurally_hard_candidate until exact-build agent
  calibration is performed.
